<!DOCTYPE html>
<html lang="en">
<head>

<title>Payment Decisions Study</title>
<style>
:root{
  --purple:#7a00e6; --purple-2:#5a00c7; --purple-deep:#3d0a8a; --orange:#f26b3a; --coral:#f48a6e;
  --navy:#141b3c; --ink:#141b3c; --muted:#8a8fa3; --line:#ece9f3; --bg:#f5f3fb; --card:#ffffff;
  --lav:#ead9fb; --soft:#f3ecfd; --ok:#15803d; --bad:#be123c;
  --grad:linear-gradient(160deg,#8f00ff 0%,#6a00d9 55%,#4b00b0 100%);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;position:relative}
@media (min-width:600px){ #app{margin:24px auto;min-height:calc(100vh - 48px);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(61,10,138,.2)} }
.content{padding:16px;flex:1}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(20,27,60,.05),0 8px 24px rgba(61,10,138,.07);margin-bottom:14px}
h1{font-size:21px;margin:0 0 10px;color:var(--navy)} h2{font-size:17px;margin:0 0 10px;color:var(--navy)}
p{line-height:1.5;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--purple);color:#fff;box-shadow:0 6px 16px rgba(122,0,230,.25)}
.btn-primary:disabled{background:#c9c3d8;box-shadow:none;cursor:not-allowed}
ul.story{padding-left:18px;margin:6px 0 10px} ul.story li{margin-bottom:6px;line-height:1.4}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;line-height:1.4}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--purple);flex:0 0 20px}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
/* purple header with orange shapes (used on info pages) */
.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;padding:18px 18px 36px}
.hero::before{content:"";position:absolute;left:-60px;top:-40px;width:200px;height:150px;background:var(--orange);opacity:.85;border-radius:40px;transform:rotate(-28deg)}
.hero > *{position:relative}
.hero .row{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px}
.logo .mark{width:30px;height:30px;border-radius:10px;background:#fff;color:var(--purple);display:grid;place-items:center;font-size:14px}
.pill{font-size:12px;font-weight:600;background:rgba(255,255,255,.2);padding:5px 10px;border-radius:999px}
.bar{height:5px;background:rgba(255,255,255,.25);border-radius:999px;margin-top:14px;overflow:hidden}
.bar span{display:block;height:100%;background:#fff;border-radius:999px;transition:width .3s}
.lift{margin-top:-22px;position:relative}
.plainbar{height:5px;background:var(--line);border-radius:999px;margin:0 0 16px;overflow:hidden}
.plainbar span{display:block;height:100%;background:var(--purple);border-radius:999px}

/* ===== Collect-money request screen (matches reference layout) ===== */
.cm{position:relative;min-height:100vh;overflow:hidden;background:var(--grad);padding:18px 16px 24px;display:flex;flex-direction:column}
@media (min-width:600px){ .cm{min-height:calc(100vh - 48px)} }
.cm::before{content:"";position:absolute;left:-140px;top:52%;width:520px;height:420px;background:linear-gradient(160deg,#f7926f,#f26b3a);transform:rotate(28deg);border-radius:60px;opacity:.95}
.cm::after{content:"";position:absolute;right:-120px;bottom:-80px;width:360px;height:300px;background:#7d1fd6;border-radius:80px;transform:rotate(-30deg);opacity:.9}
.cm > *{position:relative;z-index:1}
.cm-top{display:flex;align-items:center;justify-content:center;position:relative;height:52px;color:#fff;font-size:18px;font-weight:600}
.cm-top .pill{position:absolute;right:0}
.cm-amount{background:rgba(255,255,255,.12);border-radius:18px;padding:16px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:17px}
.cm-amount b{font-weight:600;font-size:18px}
.cm-card{background:#fff;border-radius:18px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:14px;margin-top:16px;box-shadow:0 6px 18px rgba(30,0,80,.12)}
.at{width:58px;height:58px;flex:0 0 58px;border-radius:16px;background:#fde6dc;color:var(--orange);display:grid;place-items:center;font-size:30px;font-weight:700}
.to-lbl{color:var(--muted);font-size:14px}
.to-name{color:var(--muted);font-size:15px;letter-spacing:.2px;margin:4px 0;text-transform:uppercase;word-break:break-word}
.to-addr{color:var(--navy);font-size:16px;word-break:break-all}
.block{margin-left:auto;flex:0 0 auto;border:1px solid #eee;border-radius:12px;padding:8px 10px;text-align:center;color:var(--orange);font-size:14px;background:#fff;cursor:pointer}
.block .ic{display:block;font-size:22px;line-height:1;margin-bottom:4px}
.toggle{display:block;margin:16px auto 0;background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:12px;padding:10px 26px;font-size:16px;font-weight:600;cursor:pointer}
.details{background:#fff;border-radius:18px;padding:6px 18px;margin-top:16px;box-shadow:0 6px 18px rgba(30,0,80,.12)}
.drow{display:flex;justify-content:space-between;gap:14px;padding:11px 0;font-size:15px}
.drow .k{color:var(--muted);flex:0 0 auto}
.drow .v{color:var(--navy);text-align:right;word-break:break-word}
.drow .v.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.reason{background:#fff;border-radius:18px;padding:16px 18px;margin-top:14px;display:flex;align-items:center;gap:10px;font-size:16px;box-shadow:0 6px 18px rgba(30,0,80,.12)}
.reason .v{color:var(--muted);margin-left:auto;text-align:right}
.reason .chev{color:var(--orange);font-weight:700}
.cm-btns{display:grid;grid-template-columns:1fr 1.6fr;gap:14px;margin-top:auto;padding-top:22px}
.b-rej{background:var(--lav);color:#8a2be2;border:0;border-radius:18px;padding:18px;font-size:18px;font-weight:500;cursor:pointer}
.b-acc{background:#fff;color:var(--navy);border:0;border-radius:18px;padding:18px;font-size:18px;font-weight:500;cursor:pointer}

/* follow-up / questionnaire */
.mini{display:flex;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:16px}
.mini .at{width:38px;height:38px;flex-basis:38px;font-size:18px;border-radius:10px}
.badge{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.4px}
.badge.acc{background:#f3e8ff;color:var(--purple)} .badge.rej{background:#fde6dc;color:#c2410c}
.q{margin-bottom:22px}
.q-title{font-weight:700;margin-bottom:10px;line-height:1.4;color:var(--navy)}
.q-hint{font-size:13px;color:var(--muted);margin:-6px 0 10px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:#fff;line-height:1.35}
.opt input{width:18px;height:18px;accent-color:var(--purple);flex:0 0 18px}
.opt.sel{border-color:var(--purple);background:var(--soft)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale label{display:flex;align-items:center;justify-content:center;padding:12px 0;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;font-weight:700;position:relative}
.scale label.sel{border-color:var(--purple);background:var(--soft);color:var(--purple)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.anchors{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:8px}
.anchors span:last-child{text-align:right}
.err{color:var(--bad);font-size:13px;margin-top:6px;display:none}
.q.invalid .err{display:block}
.section-tag{display:inline-block;background:var(--soft);color:var(--purple);font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:8px;letter-spacing:.3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90%;text-align:center}
.debrief-item{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.debrief-item:last-child{border-bottom:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px}
.tag.gen{background:#dcfce7;color:var(--ok)} .tag.fr{background:#ffe4e6;color:var(--bad)}
.pid{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:18px;letter-spacing:1px;color:var(--purple)}
/* pre-request phone message */
.phone{flex:1;min-height:100vh;background:linear-gradient(180deg,#1b1442 0%,#141b3c 100%);padding:48px 16px 24px;display:flex;flex-direction:column;gap:16px}
.ph-time{color:#fff;text-align:center;font-size:56px;font-weight:300;letter-spacing:1px}
.ph-label{color:rgba(255,255,255,.65);text-align:center;font-size:13px;margin-top:-10px;margin-bottom:12px}
.msgcard{background:rgba(255,255,255,.96);border-radius:20px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.msg-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--navy)}
.chan{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px}
.chan.wa{background:#dcfce7} .chan.sms{background:#e0e7ff}
.msg-from{font-weight:800;margin:10px 0 6px;color:var(--navy)}
.bubble{background:var(--soft);border-radius:4px 16px 16px 16px;padding:10px 12px;line-height:1.45;font-size:15px;color:var(--navy)}
.phone .btn{margin-top:auto}
</style>

<script>
/* =====================================================================
   CONFIGURATION — Google Apps Script web-app URL (see README.md)
   ===================================================================== */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwJ2ar1jaI1aijDkuGHl28Zc-_J7lQLPGZkjvRHI6J0pCRROxcP6j-Nw2H52u0l7tqE/exec",
  STUDY_VERSION: "v6",
  START_BALANCE: 10000,
  ONE_SESSION_PER_DEVICE: true
};

/* =====================================================================
   EXPERIMENTAL DESIGN (unchanged)
   8 scenarios = 2x2x2 crossing of urgency x amount x presentation.
   Genuine vs fraudulent versions differ ONLY in sender identity
   (wallet address, registered name, history with this account).
   Per participant: 4 fraudulent + 4 genuine, random order.
   expiryMins: how long the request stays valid (urgent = minutes).
   reason: "Reason for transfer" shown on the request (same in both versions).
   ===================================================================== */
const SCENARIOS = [
  { id:"S1", label:"Mariam Hassan – Thursday dinner", urgency:"No", amountLevel:"Low", presentation:"Personal",
    displayName:"Mariam Hassan", initials:"MH", amount:180, note:"Thursday dinner 🍕 your share", expiryMins:7*24*60, reason:"Shared Expenses",
    genuine:{ address:"mariam.hassan@pay", registeredName:"MARIAM HASSAN MAHMOUD ELSAYED", history:"6 previous transactions · last on 12 Oct" },
    fraud:{   address:"mariam.hasan22@pay", registeredName:"MOHAMED ABDELRAHMAN SAEED", history:"No previous transactions" } },
  { id:"S2", label:"Book Corner – delivery fee", urgency:"No", amountLevel:"Low", presentation:"Official",
    displayName:"Book Corner", initials:"BC", amount:35, note:"DELIVERY FEE – ORDER #20417", expiryMins:7*24*60, reason:"Purchase of Goods",
    genuine:{ address:"bookcorner@pay", registeredName:"BOOK CORNER BOOKSTORE", history:"2 previous transactions · last on 26 Oct" },
    fraud:{   address:"bookcorner.delivery@pay", registeredName:"MAHMOUD ADEL RAGAB", history:"No previous transactions" } },
  { id:"S3", label:"Youssef Tarek – money sent by mistake", urgency:"No", amountLevel:"High", presentation:"Personal",
    displayName:"Youssef Tarek", initials:"YT", amount:1500, note:"sorry, sent you 1,500 by mistake yesterday 🤦‍♂️ can you send it back?", expiryMins:7*24*60, reason:"Refund",
    genuine:{ address:"youssef.tarek@pay", registeredName:"YOUSSEF TAREK ABDELAZIZ", history:"You received EGP 1,500 from this account yesterday" },
    fraud:{   address:"youssef.tarek.eg@pay", registeredName:"AHMED SAMIR FATHY", history:"No previous transactions" } },
  { id:"S4", label:"Nada Housing – apartment deposit", urgency:"No", amountLevel:"High", presentation:"Official",
    displayName:"Nada Housing Services", initials:"NH", amount:2000, note:"NOVEMBER DEPOSIT – APARTMENT 4B, NASR CITY", expiryMins:7*24*60, reason:"Rent",
    genuine:{ address:"nada.housing@pay", registeredName:"NADA HOUSING SERVICES", history:"1 previous transaction · last on 1 Oct" },
    fraud:{   address:"nada.housing.office@pay", registeredName:"SHERIF NABIL ABDELHAMID", history:"No previous transactions" } },
  { id:"S5", label:"Omar Khaled – taxi share", urgency:"Yes", amountLevel:"Low", presentation:"Personal",
    displayName:"Omar Khaled", initials:"OK", amount:70, note:"taxi share 🚕 please send it NOW, I'm at the cashier and short on balance!!", expiryMins:10, reason:"Shared Expenses",
    genuine:{ address:"omar.khaled@pay", registeredName:"OMAR KHALED MOSTAFA", history:"9 previous transactions · last on 20 Oct" },
    fraud:{   address:"omar.khaled.01@pay", registeredName:"AHMED KAMAL IBRAHIM", history:"No previous transactions" } },
  { id:"S6", label:"City Sports Club – membership", urgency:"Yes", amountLevel:"Low", presentation:"Official",
    displayName:"City Sports Club", initials:"CS", amount:150, note:"MEMBERSHIP PAYMENT DUE TODAY – ACCESS SUSPENDED AFTER 23:59", expiryMins:15, reason:"Membership Fees",
    genuine:{ address:"city.sports@pay", registeredName:"CITY SPORTS CLUB", history:"5 previous transactions · last on 1 Oct" },
    fraud:{   address:"citysports.club@pay", registeredName:"HAZEM MOHAMED ABDO", history:"No previous transactions" } },
  { id:"S7", label:"Laila Adel – pharmacy for mom", urgency:"Yes", amountLevel:"High", presentation:"Personal",
    displayName:"Laila Adel", initials:"LA", amount:1200, note:"at the hospital with mom 😢 need 1,200 for the pharmacy RIGHT NOW please", expiryMins:10, reason:"Family Support",
    genuine:{ address:"laila.adel@pay", registeredName:"LAILA ADEL MOHAMED", history:"14 previous transactions · last on 24 Oct" },
    fraud:{   address:"laila.adel7@pay", registeredName:"KARIM SAMY HELMY", history:"No previous transactions" } },
  { id:"S8", label:"Sea Breeze Travel Club – Alexandria trip", urgency:"Yes", amountLevel:"High", presentation:"Official",
    displayName:"Sea Breeze Travel Club", initials:"SB", amount:2450, note:"FINAL NOTICE: ALEXANDRIA TRIP BOOKING CANCELLED UNLESS PAID WITHIN 15 MIN", expiryMins:15, reason:"Travel & Tourism",
    genuine:{ address:"seabreeze.travel@pay", registeredName:"SEA BREEZE TRAVEL CLUB", history:"1 previous transaction · last on 27 Oct" },
    fraud:{   address:"seabreeze.bookings@pay", registeredName:"MAHMOUD FAROUK ZAKI", history:"No previous transactions" } }
];
const N_FRAUD = 4;

/* PRE-REQUEST MESSAGE (unchanged): 4 of 8 requests (2 genuine + 2 fraudulent);
   message text identical in both versions of a scenario. */
const N_MSG_PER_TRUTH = 2;
const MESSAGES = {
  S1:{ channel:"WhatsApp", sender:"Mariam Hassan", type:"Bill-split reminder",
       text:"Hey! Sent you the request for Thursday's dinner 🍕 180 each, pay whenever you can" },
  S2:{ channel:"SMS", sender:"BookCorner", type:"Delivery notice",
       text:"Your order #20417 is out for delivery. A EGP 35 delivery fee request has been sent to your payment app." },
  S3:{ channel:"WhatsApp", sender:"+20 112 345 6789", type:"Mistaken transfer (unknown number)",
       text:"Hi, I accidentally transferred money to your account. This is my old number, and I'm your friend Youssef. Could you please send the 1,500 back? I sent you a request." },
  S4:{ channel:"SMS", sender:"NadaHousing", type:"Payment reminder",
       text:"Reminder: your November deposit for Apartment 4B is due. A payment request of EGP 2,000 has been sent to you." },
  S5:{ channel:"WhatsApp", sender:"Omar Khaled", type:"Urgent favour",
       text:"send the taxi money NOW pls 🙏 I'm at the cashier and my balance is short" },
  S6:{ channel:"SMS", sender:"CitySports", type:"Suspension warning",
       text:"Your membership expires TODAY. Pay EGP 150 now to avoid suspension. A payment request has been sent to you." },
  S7:{ channel:"WhatsApp", sender:"Laila (sister)", type:"Family emergency",
       text:"Mom is at the hospital 😢 I need 1,200 for the pharmacy right now. Sent you a request, please hurry" },
  S8:{ channel:"SMS", sender:"SeaBreeze", type:"Cancellation threat",
       text:"FINAL NOTICE: Your Alexandria trip booking will be CANCELLED unless EGP 2,450 is paid within 15 minutes. Request sent." }
};

/* PER-REQUEST DECISION QUESTION (one checklist, multiple selections) */
const DECISION_Q = "What made you decide to accept or reject this money request?";
const FACTOR_OPTIONS = [
  { key:"f_sender_name",      text:"Name of the sender" },
  { key:"f_notification_sms", text:"Notification/SMS received before the request" },
  { key:"f_history",          text:"History with this account" },
  { key:"f_note",             text:"Note attached to the request" },
  { key:"f_amount",           text:"The amount requested" },
  { key:"f_urgency",          text:"Urgency of the request" }
];

/* QUESTIONNAIRE — all at the end, age is the very last question */
const POST_SECTIONS = [
  { tag:"Part A", title:"Your use of payment apps", questions:[
    { key:"A1_instapay_frequency", type:"single", text:"How often do you use InstaPay?",
      options:["Daily","Weekly","A few times a month"] },
    { key:"A3_transaction_confidence", type:"scale", text:"How confident do you feel when making digital payment transactions?",
      anchors:["Not at all confident","Very confident"] },
    { key:"A4_online_scam_experience", type:"single", text:"Have you previously encountered an online payment scam?",
      options:["No","Yes, but I did not lose money.","Yes, and I lost money."] }
  ]},
  { tag:"Part B", title:"Your usual habits", questions:[
    { key:"B1_verify_sender", type:"single", text:"Do you normally verify the sender's identity before accepting a payment request?",
      options:["Yes","No"] },
    { key:"B2_amount_importance", type:"scale", text:"How important is the requested amount when you decide whether to accept a payment request?",
      anchors:["Not at all important","Extremely important"] }
  ]},
  { tag:"Last question", title:"About you", questions:[
    { key:"age_range", type:"single", text:"What is your age range?",
      options:["Under 18","18–30","30–40","40–50","50+"] }
  ]}
];
const TOTAL_UNITS = SCENARIOS.length + POST_SECTIONS.length;

/* =====================================================================
   STATE + HELPERS
   ===================================================================== */
const S = { pid:null, start:null, fraudSet:[], msgSet:[], order:[], idx:0, shownAt:0, decidedAt:0, msgShownAt:0, msgViewMs:"",
            cur:null, pending:null, responses:[], answers:{}, balance:CONFIG.START_BALANCE, section:0, end:null };
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function makeId(){
  const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; const arr=new Uint32Array(6);
  try{ crypto.getRandomValues(arr); }catch(e){ for(let i=0;i<6;i++) arr[i]=Math.floor(Math.random()*1e9); }
  for(let i=0;i<6;i++) s+=abc[arr[i]%abc.length]; return "P-"+s;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n){ return n.toLocaleString("en-US"); }
function nowIso(){ return new Date().toISOString(); }
function deviceType(){ const ua=navigator.userAgent||""; return /iPhone|iPad|iPod/i.test(ua)?"iOS":/Android/i.test(ua)?"Android":/Mobi/i.test(ua)?"Other mobile":"Desktop"; }
function refNumber(){ let s=String(1+Math.floor(Math.random()*9)); for(let i=0;i<11;i++) s+=Math.floor(Math.random()*10); return s; }
function fmtExpiry(d){
  const p=n=>String(n).padStart(2,"0"); let h=d.getHours(); const ap=h>=12?"PM":"AM"; h=h%12||12;
  return `${p(d.getDate())}-${p(d.getMonth()+1)}-${d.getFullYear()} ${p(h)}:${p(d.getMinutes())}:${p(d.getSeconds())} ${ap}`;
}
const $app=document.getElementById("app");
function scrollTop(){ window.scrollTo(0,0); }
function pct(units){ return Math.round(100*units/TOTAL_UNITS); }
function toast(t){ const el=document.createElement("div"); el.className="toast"; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(),2200); }

/* =====================================================================
   SAVING (queue + retry + on-device backup; each request saved at once)
   ===================================================================== */
async function postOnce(payload){
  const body=JSON.stringify(payload);
  try{
    const r=await fetch(CONFIG.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    const j=await r.json(); if(j&&j.ok) return "ok"; throw new Error((j&&j.error)||"bad response");
  }catch(e){
    try{ await fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); return "unconfirmed"; }
    catch(e2){ return "fail"; }
  }
}
let flushing=null;
function send(payload){ const q=load("pending")||[]; q.push(payload); store("pending",q); return flush(); }
function flush(){
  if(!CONFIG.SCRIPT_URL) return Promise.resolve("no-url");
  if(flushing) return flushing.then(()=>flush());
  flushing=(async()=>{
    let q=load("pending")||[], last="ok";
    while(q.length){
      let res="fail";
      for(let a=0;a<4&&res==="fail";a++){ if(a) await new Promise(r=>setTimeout(r,1500*a)); res=await postOnce(q[0]); }
      if(res==="fail"){ last="fail"; break; }
      if(res==="unconfirmed") last="unconfirmed";
      q.shift(); store("pending",q);
    }
    return last;
  })();
  const p=flushing; p.finally(()=>{ if(flushing===p) flushing=null; }); return p;
}
window.addEventListener("online",()=>{ flush(); });

/* =====================================================================
   DATA ROWS
   ===================================================================== */
function counts(){
  const d=S.responses;
  return {
    requests_completed:d.length,
    accept_count:d.filter(x=>x.decision==="Accept").length,
    reject_count:d.filter(x=>x.decision==="Reject").length,
    n_correct:d.filter(x=>x.correct===1).length,
    accuracy_pct:d.length?Math.round(100*d.filter(x=>x.correct===1).length/d.length):"",
    false_acceptances:d.filter(x=>x.error_type==="False acceptance").length,
    false_rejections:d.filter(x=>x.error_type==="False rejection").length,
    accepts_with_message:d.filter(x=>x.message_shown==="Yes"&&x.decision==="Accept").length,
    accepts_without_message:d.filter(x=>x.message_shown==="No"&&x.decision==="Accept").length,
    false_acceptances_with_message:d.filter(x=>x.message_shown==="Yes"&&x.error_type==="False acceptance").length,
    false_acceptances_without_message:d.filter(x=>x.message_shown==="No"&&x.error_type==="False acceptance").length
  };
}
function participantRow(status){
  const row={ participant_id:S.pid, study_version:CONFIG.STUDY_VERSION, start_time:S.start,
    end_time:S.end||"", duration_sec:S.end?Math.round((new Date(S.end)-new Date(S.start))/1000):"",
    consent:"Yes", completion_status:status, device:deviceType(),
    fraudulent_scenarios:S.fraudSet.join(";"), message_scenarios:S.msgSet.join(";"), presentation_order:S.order.join(";"), ...counts() };
  POST_SECTIONS.forEach(sec=>sec.questions.forEach(q=>{ const v=S.answers[q.key]; row[q.key]=v===undefined?"":v; }));
  return row;
}

/* =====================================================================
   SCREENS
   ===================================================================== */
function hero(label, units){
  return `<div class="hero"><div class="row"><div class="logo"><div class="mark">◆</div>Pay</div>${label?`<div class="pill">${label}</div>`:""}</div>
  ${units!==undefined?`<div class="bar"><span style="width:${pct(units)}%"></span></div>`:""}</div>`;
}
function screenAlreadyDone(){
  $app.innerHTML=`<div class="content"><div class="card"><h1>Thank you</h1><p>This device has already completed the study. Each person can take part once.</p></div></div>`;
}
function screenConsent(){
  $app.innerHTML=hero("")+`<div class="content lift"><div class="card">
    <h1>Payment Decisions Study</h1>
    <p>This academic study looks at how people decide on money requests in digital payment apps. It takes about 8–10 minutes.</p>
    <p><b>What you will do:</b> receive 8 money requests in a simulated payment app. For each one, choose <b>Accept</b> or <b>Reject</b> and tick what made you decide. A few short questions follow at the end.</p>
    <p><b>No real money</b> is involved and you will <b>never</b> be asked for a PIN, password or any banking details. You will not need to type anything.</p>
    <p><b>Your privacy:</b> participation is anonymous. You get a random code; we do not collect your name, phone number or contact details. Answers are used for research analysis only.</p>
    <p>Taking part is voluntary and you may stop at any time by closing the page.</p>
    <label class="check"><input type="checkbox" id="c1"> <span>I am 18 or older and I use a digital payment application.</span></label>
    <label class="check"><input type="checkbox" id="c2"> <span>I have read the information above and agree to take part.</span></label>
    <button class="btn btn-primary" id="go" disabled>Start</button>
  </div></div>`;
  const c1=document.getElementById("c1"),c2=document.getElementById("c2"),go=document.getElementById("go");
  const upd=()=>{ go.disabled=!(c1.checked&&c2.checked); }; c1.onchange=upd; c2.onchange=upd;
  go.onclick=()=>{
    S.pid=makeId(); S.start=nowIso();
    S.fraudSet=shuffle(SCENARIOS.map(s=>s.id)).slice(0,N_FRAUD).sort();
    S.order=shuffle(SCENARIOS.map(s=>s.id));
    const gen=SCENARIOS.map(s=>s.id).filter(id=>!S.fraudSet.includes(id));
    S.msgSet=shuffle(S.fraudSet).slice(0,N_MSG_PER_TRUTH).concat(shuffle(gen).slice(0,N_MSG_PER_TRUTH)).sort();
    send({participant:participantRow("Started")});
    screenBriefing();
  };
  scrollTop();
}
function screenBriefing(){
  $app.innerHTML=hero("Ready",0)+`<div class="content lift"><div class="card">
    <h1>Your role</h1>
    <p>In this study you are <b>Nour Adel</b>, a user of this payment app. This is what happened in Nour's life recently:</p>
    <ul class="story">
      <li>Had dinner with friends on Thursday and agreed to split the bill.</li>
      <li>Ordered a book online from a bookshop (order #20417).</li>
      <li>Booked a weekend trip to Alexandria with a travel club.</li>
      <li>Is renting an apartment through a housing agency.</li>
      <li>Is a member of a sports club and shares taxis with friends.</li>
      <li>Has a sister, Laila, and friends who sometimes send or request money.</li>
    </ul>
    <p>You will now receive <b>8 money requests</b>. Some may arrive after a message on your phone, just like in real life. Everything you need is shown on each screen.</p>
    <p><b>Decide on each request as you normally would</b> in your own payment app.</p>
  </div><button class="btn btn-primary" id="go">Open my requests</button></div>`;
  document.getElementById("go").onclick=()=>{ S.idx=0; nextRequest(); };
  scrollTop();
}
function nextRequest(){
  const id=S.order[S.idx];
  if(S.msgSet.includes(id)) screenMessage(); else { S.msgViewMs=""; screenRequest(); }
}
function screenMessage(){
  const id=S.order[S.idx], m=MESSAGES[id], wa=m.channel==="WhatsApp";
  $app.innerHTML=`<div class="phone"><div class="ph-time">${new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}</div>
    <div class="ph-label">Request ${S.idx+1} of ${SCENARIOS.length}</div>
    <div class="msgcard"><div class="msg-top"><span class="chan ${wa?"wa":"sms"}">${wa?"💬":"✉️"}</span>
      <b>${esc(m.channel)}</b><span class="small muted" style="margin-left:auto">now</span></div>
      <div class="msg-from">${esc(m.sender)}</div><div class="bubble">${esc(m.text)}</div></div>
    <button class="btn btn-primary" id="go">Open payment app</button></div>`;
  S.msgShownAt=performance.now();
  document.getElementById("go").onclick=()=>{ S.msgViewMs=Math.round(performance.now()-S.msgShownAt); screenRequest(); };
  scrollTop();
}
function currentScenario(){
  const sc=SCENARIOS.find(s=>s.id===S.order[S.idx]); const isFraud=S.fraudSet.includes(sc.id);
  return { sc, isFraud, v:isFraud?sc.fraud:sc.genuine };
}
function screenRequest(){
  const { sc, v }=currentScenario(); const official=sc.presentation==="Official";
  S.cur={ ref:refNumber(), expiry:fmtExpiry(new Date(Date.now()+sc.expiryMins*60000)), collapsed:0, block:0 };
  $app.innerHTML=`<div class="cm">
    <div class="cm-top">Collect Money<span class="pill">${S.idx+1} of ${SCENARIOS.length}</span></div>
    <div class="cm-amount"><span>Total Amount</span><b>${fmt(sc.amount)} EGP</b></div>
    <div class="cm-card">
      <div class="at">@</div>
      <div style="min-width:0"><div class="to-lbl">To</div>
        <div class="to-name">${esc(v.registeredName)}</div>
        <div class="to-addr">${esc(v.address)}</div></div>
      <button class="block" id="blk" type="button"><span class="ic">⊘</span>Block</button>
    </div>
    <button class="toggle" id="tog" type="button">Less Details ⌃</button>
    <div class="details" id="det">
      <div class="drow"><span class="k">Reference Number</span><span class="v">${S.cur.ref}</span></div>
      <div class="drow"><span class="k">Expiry Date</span><span class="v">${S.cur.expiry}</span></div>
      <div class="drow"><span class="k">Note</span><span class="v ${official?"mono":""}">${esc(sc.note)}</span></div>
      <div class="drow"><span class="k">History with this account</span><span class="v">${esc(v.history)}</span></div>
    </div>
    <div class="reason"><span>Reason for transfer</span><span class="v">${esc(sc.reason)}</span><span class="chev">⌄</span></div>
    <div class="cm-btns"><button class="b-rej" id="rej">Reject</button><button class="b-acc" id="acc">Accept</button></div>
  </div>`;
  S.shownAt=performance.now();
  const det=document.getElementById("det"), tog=document.getElementById("tog");
  tog.onclick=()=>{ const open=det.style.display!=="none"; det.style.display=open?"none":"block";
    tog.textContent=open?"More Details ⌄":"Less Details ⌃"; if(open) S.cur.collapsed=1; };
  document.getElementById("blk").onclick=()=>{ S.cur.block=1; toast("Blocking is not part of this study – please choose Accept or Reject."); };
  document.getElementById("acc").onclick=()=>decide("Accept");
  document.getElementById("rej").onclick=()=>decide("Reject");
  scrollTop();
}
function decide(decision){
  const rt=Math.round(performance.now()-S.shownAt); S.decidedAt=performance.now();
  const { sc, isFraud, v }=currentScenario();
  const truth=isFraud?"Fraudulent":"Genuine";
  const correct=(truth==="Genuine"&&decision==="Accept")||(truth==="Fraudulent"&&decision==="Reject");
  S.pending={ sc, v, isFraud, truth, decision, correct, rt, decision_time:nowIso(), cur:S.cur,
    msgShown:S.msgSet.includes(sc.id), msgViewMs:S.msgViewMs,
    error_type: correct?"None":(truth==="Fraudulent"?"False acceptance":"False rejection") };
  if(decision==="Accept") S.balance-=sc.amount;
  screenReason();
}
function screenReason(){
  const P=S.pending, acc=P.decision==="Accept";
  $app.innerHTML=hero(`Request ${S.idx+1} of ${SCENARIOS.length}`, S.idx+0.5)+`<div class="content lift"><div class="card">
    <div class="mini"><div class="at">@</div>
      <div><b>${esc(P.v.address)}</b><div class="small muted">${fmt(P.sc.amount)} EGP</div></div>
      <span class="badge ${acc?"acc":"rej"}">${acc?"ACCEPTED":"REJECTED"}</span></div>
    <div class="q" data-key="factors"><div class="q-title">${esc(DECISION_Q)}</div>
      <div class="q-hint">Select all that apply.</div>
      ${FACTOR_OPTIONS.map(o=>`<label class="opt"><input type="checkbox" value="${o.key}"><span>${esc(o.text)}</span></label>`).join("")}
      <div class="err">Please select at least one.</div></div>
    <button class="btn btn-primary" id="next" disabled>Continue</button>
  </div></div>`;
  const boxes=[...document.querySelectorAll('.q[data-key="factors"] .opt input')], next=document.getElementById("next");
  boxes.forEach(b=>b.onchange=()=>{ b.closest(".opt").classList.toggle("sel",b.checked); next.disabled=!boxes.some(x=>x.checked); });
  next.onclick=()=>{
    const chosen=boxes.filter(b=>b.checked).map(b=>b.value); if(!chosen.length) return;
    next.disabled=true; saveResponse(chosen);
    S.idx++; if(S.idx<SCENARIOS.length) nextRequest(); else { S.section=0; screenPost(); }
  };
  scrollTop();
}
function saveResponse(chosen){
  const P=S.pending, m=P.msgShown?MESSAGES[P.sc.id]:null;
  const row={
    timestamp:nowIso(), participant_id:S.pid, request_id:P.sc.id, response_id:`${S.pid}_${P.sc.id}`, position:S.idx+1,
    scenario_label:P.sc.label, ground_truth:P.truth, decision:P.decision, correct:P.correct?1:0, error_type:P.error_type,
    decision_time:P.decision_time, response_time_ms:P.rt, reason_time_ms:Math.round(performance.now()-S.decidedAt),
    decision_question:DECISION_Q,
    selected_factors:FACTOR_OPTIONS.filter(o=>chosen.includes(o.key)).map(o=>o.text).join(" | "), n_factors:chosen.length,
    display_name:P.sc.displayName, wallet_address:P.v.address, registered_name:P.v.registeredName,
    history_with_sender:P.v.history, sender_identity_consistent:P.isFraud?"No":"Yes",
    amount_egp:P.sc.amount, amount_level:P.sc.amountLevel, urgency:P.sc.urgency, presentation:P.sc.presentation,
    note:P.sc.note, reason_for_transfer:P.sc.reason, reference_number:P.cur.ref, expiry_date:P.cur.expiry,
    details_collapsed:P.cur.collapsed, block_clicked:P.cur.block,
    message_shown:P.msgShown?"Yes":"No", message_type:m?m.type:"", message_channel:m?m.channel:"",
    message_sender:m?m.sender:"", message_text:m?m.text:"", message_view_ms:m?P.msgViewMs:""
  };
  FACTOR_OPTIONS.forEach(o=>row[o.key]=chosen.includes(o.key)?1:0);
  S.responses.push(row);
  send({ participant:participantRow("In progress"), responses:[row] });
}
function renderQuestion(q){
  let h=`<div class="q" data-key="${q.key}"><div class="q-title">${esc(q.text)}</div>`;
  if(q.type==="single") q.options.forEach(o=>{ h+=`<label class="opt"><input type="radio" name="${q.key}" value="${esc(o)}"><span>${esc(o)}</span></label>`; });
  else if(q.type==="scale") h+=`<div class="scale">`+[1,2,3,4,5].map(n=>`<label><input type="radio" name="${q.key}" value="${n}">${n}</label>`).join("")+`</div>
      <div class="anchors"><span>1 = ${esc(q.anchors[0])}</span><span>5 = ${esc(q.anchors[1])}</span></div>`;
  return h+`<div class="err">Please answer this question.</div></div>`;
}
function screenQuestions(sec, units, onDone, btnLabel){
  $app.innerHTML=`<div class="content" style="padding-top:22px"><div class="plainbar"><span style="width:${pct(units)}%"></span></div><div class="card">
    <span class="section-tag">${esc(sec.tag)}</span><h1>${esc(sec.title)}</h1>
    ${sec.intro?`<p class="muted small">${sec.intro}</p>`:""}
    <form id="f">${sec.questions.map(renderQuestion).join("")}</form>
    <button class="btn btn-primary" id="next">${btnLabel||"Continue"}</button><div class="status" id="st"></div></div></div>`;
  const form=document.getElementById("f");
  form.addEventListener("change",e=>{
    form.querySelectorAll("label.opt, .scale label").forEach(l=>{ const i=l.querySelector("input"); l.classList.toggle("sel",i.checked); });
    const qd=e.target.closest(".q"); if(qd) qd.classList.remove("invalid");
  });
  document.getElementById("next").onclick=()=>{
    let bad=null;
    sec.questions.forEach(q=>{
      const c=form.querySelector(`input[name="${q.key}"]:checked`); let val=c?c.value:"";
      if(q.type==="scale"&&val) val=Number(val);
      const qd=form.querySelector(`.q[data-key="${q.key}"]`);
      if(val===""){ qd.classList.add("invalid"); if(!bad) bad=qd; } else S.answers[q.key]=val;
    });
    if(bad){ bad.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    onDone();
  };
  scrollTop();
}
function screenPost(){
  const sec={...POST_SECTIONS[S.section]};
  if(S.section===0) sec.intro="Thank you – the payment requests are finished. A few short questions follow.";
  const isLast=S.section===POST_SECTIONS.length-1;
  screenQuestions(sec, SCENARIOS.length+S.section, async ()=>{
    if(!isLast){ S.section++; screenPost(); return; }
    const btn=document.getElementById("next"); btn.disabled=true; btn.textContent="Saving…";
    S.end=nowIso();
    const res=await send({ participant:participantRow("Completed") });
    if(CONFIG.ONE_SESSION_PER_DEVICE) store("completed",S.pid);
    screenDebrief(res);
  }, isLast?"Finish":"Continue");
}
function screenDebrief(saveResult){
  const items=S.responses.map(d=>{
    const sc=SCENARIOS.find(s=>s.id===d.request_id), gen=d.ground_truth==="Genuine";
    const why=gen
      ? `Genuine: the address <b>${esc(sc.genuine.address)}</b> and registered name matched ${esc(sc.displayName)}, and you had paid this account before.`
      : `Fraudulent: the address <b>${esc(sc.fraud.address)}</b> imitated the real one (${esc(sc.genuine.address)}), the registered name was <b>${esc(sc.fraud.registeredName)}</b> instead of ${esc(sc.displayName)}, and there were no previous transactions.`;
    return `<div class="debrief-item"><b>Request ${d.position}: ${esc(sc.displayName)} – EGP ${fmt(sc.amount)}</b>
      <span class="tag ${gen?"gen":"fr"}">${gen?"Genuine":"Fraudulent"}</span><br>
      <span class="muted">You chose ${d.decision} ${d.correct?"✓":"✗"}</span><br>${why}</div>`;
  }).join("");
  const c=counts();
  const msg=saveResult==="ok"||saveResult==="unconfirmed"?"Your answers have been saved."
    :saveResult==="no-url"?"Researcher note: no Google Sheets link is configured, so data was kept on this device only."
    :"Your answers are stored on this device and will be sent automatically when the connection returns. Please keep this page open for a moment.";
  $app.innerHTML=hero("Completed",TOTAL_UNITS)+`<div class="content lift"><div class="card"><h1>Thank you!</h1><p>${msg}</p>
    <p class="small muted">Your anonymous participant code</p><p class="pid">${esc(S.pid)}</p>
    <p class="small muted">Keep this code if you later want your data removed.</p></div>
  <div class="card"><h2>What this study was about</h2>
    <p>Some of the requests you saw were <b>fraudulent</b>. The study looks at which cues (sender, amount, urgency, wording, messages before the request) lead people to pay fake requests or to refuse real ones.</p>
    <p>In this study the reliable cue was always the <b>sender's identity</b>: the exact address, the registered account name and your history with that account. Urgency, amount, messages and an official look appeared in genuine and fraudulent requests alike.</p>
    <p>You answered <b>${c.n_correct} of ${SCENARIOS.length}</b> correctly.</p>${items}</div>
  <div class="card"><h2>How to protect yourself</h2><ul class="story">
    <li>Check the registered account name and the exact address, character by character, before paying.</li>
    <li>Be careful with requests from accounts you have never paid before, even if the name looks familiar.</li>
    <li>A message saying "this is my new/old number" is a classic scam opener – call the person on the number you know.</li>
    <li>Treat pressure (“pay now”, short deadlines, emergencies) as a reason to slow down.</li></ul></div></div>`;
  scrollTop();
}

/* START */
(function init(){
  flush();
  if(CONFIG.ONE_SESSION_PER_DEVICE&&load("completed")&&!/[?&]reset=1/.test(location.search)){ screenAlreadyDone(); return; }
  screenConsent();
})();
</script>
