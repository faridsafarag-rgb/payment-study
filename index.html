<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#3b1a6b">
<title>Payment Decisions Study</title>
<style>
:root{
  --purple:#5b21b6; --purple-deep:#3b1a6b; --magenta:#c026d3; --navy:#141b3c;
  --grad:linear-gradient(135deg,#3b1a6b 0%,#6d28d9 55%,#c026d3 100%);
  --grad-btn:linear-gradient(135deg,#6d28d9,#c026d3);
  --soft:#f4effc; --soft-2:#fbf7ff; --ink:#141b3c; --muted:#5f6684; --line:#e7e2f1;
  --bg:#f6f4fa; --card:#ffffff; --ok:#15803d; --bad:#be123c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
@media (min-width:600px){ #app{margin:24px auto;min-height:calc(100vh - 48px);border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(59,26,107,.18)} }
.topbar{background:var(--grad);color:#fff;padding:16px 18px 34px}
.topbar .row{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.3px;font-size:17px}
.logo .mark{width:30px;height:30px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:14px}
.pill{font-size:12px;font-weight:600;background:rgba(255,255,255,.18);padding:5px 10px;border-radius:999px}
.balance{margin-top:16px}
.balance small{opacity:.85;font-size:12px}
.balance div{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.3px}
.bar{height:5px;background:rgba(255,255,255,.25);border-radius:999px;margin-top:14px;overflow:hidden}
.bar span{display:block;height:100%;background:#fff;border-radius:999px;transition:width .3s}
.plainbar{height:5px;background:var(--line);border-radius:999px;margin:0 0 16px;overflow:hidden}
.plainbar span{display:block;height:100%;background:var(--grad-btn);border-radius:999px}
.content{padding:16px;flex:1}
.lift{margin-top:-22px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgba(20,27,60,.05),0 8px 24px rgba(59,26,107,.07);margin-bottom:14px}
h1{font-size:21px;margin:0 0 10px;color:var(--navy)}
h2{font-size:17px;margin:0 0 10px;color:var(--navy)}
p{line-height:1.5;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;letter-spacing:.3px}
.btn-primary{background:var(--grad-btn);color:#fff;box-shadow:0 6px 16px rgba(192,38,211,.25)}
.btn-primary:disabled{background:#c4bfd3;box-shadow:none;cursor:not-allowed}
.btn-reject{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn-accept{background:var(--grad-btn);color:#fff;border:2px solid transparent}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
ul.story{padding-left:18px;margin:6px 0 10px} ul.story li{margin-bottom:6px;line-height:1.4}
.notif{display:flex;gap:10px;align-items:center;background:var(--soft);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:13px;color:var(--navy)}
.notif b{color:var(--purple)}
.notif .dot{width:8px;height:8px;border-radius:50%;background:var(--magenta);flex:0 0 8px}
.req-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:50px;height:50px;flex:0 0 50px;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff}
.avatar.personal{border-radius:50%;background:#8b7bb8}
.avatar.official{border-radius:14px;background:var(--navy)}
.req-name{font-weight:800;font-size:17px;color:var(--navy)}
.req-addr{font-size:14px;color:var(--muted);word-break:break-all}
.amount{text-align:center;padding:14px 0 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:6px}
.amount small{display:block;color:var(--muted);font-size:13px;margin-bottom:4px}
.amount strong{font-size:34px;letter-spacing:-.5px;color:var(--navy)}
.amount strong span{font-size:16px;font-weight:700;color:var(--muted);margin-right:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:0 0 40%}
.kv .v{text-align:right;font-weight:600;word-break:break-word;color:var(--navy)}
.note-official{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.mini{display:flex;align-items:center;gap:10px;background:var(--soft-2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:16px}
.mini .avatar{width:38px;height:38px;flex-basis:38px;font-size:14px}
.badge{margin-left:auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.4px}
.badge.acc{background:#f3e8ff;color:var(--purple)} .badge.rej{background:#e8eaf3;color:var(--navy)}
.q{margin-bottom:22px}
.q-title{font-weight:700;margin-bottom:10px;line-height:1.4;color:var(--navy)}
.q-hint{font-size:13px;color:var(--muted);margin:-6px 0 10px}
.opt{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:#fff;line-height:1.35}
.opt input{width:18px;height:18px;accent-color:var(--purple);flex:0 0 18px}
.opt.sel{border-color:var(--purple);background:var(--soft)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale label{display:flex;align-items:center;justify-content:center;padding:12px 0;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:#fff;font-weight:700;position:relative}
.scale label.sel{border-color:var(--purple);background:var(--soft);color:var(--purple)}
.scale input{position:absolute;opacity:0;pointer-events:none}
.anchors{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;gap:8px}
.anchors span:last-child{text-align:right}
.err{color:var(--bad);font-size:13px;margin-top:6px;display:none}
.q.invalid .err{display:block}
.section-tag{display:inline-block;background:var(--soft);color:var(--purple);font-weight:800;font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:8px;letter-spacing:.3px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-size:15px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.debrief-item{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.debrief-item:last-child{border-bottom:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px}
.tag.gen{background:#dcfce7;color:var(--ok)} .tag.fr{background:#ffe4e6;color:var(--bad)}
.pid{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:18px;letter-spacing:1px;color:var(--purple)}
.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0;line-height:1.4}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--purple);flex:0 0 20px}
.status{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.phone{flex:1;min-height:100vh;background:linear-gradient(180deg,#1b1442 0%,#141b3c 100%);padding:48px 16px 24px;display:flex;flex-direction:column;gap:16px}
.ph-time{color:#fff;text-align:center;font-size:56px;font-weight:300;letter-spacing:1px}
.ph-label{color:rgba(255,255,255,.65);text-align:center;font-size:13px;margin-top:-10px;margin-bottom:12px}
.msgcard{background:rgba(255,255,255,.96);border-radius:20px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.msg-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--navy)}
.chan{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:13px}
.chan.wa{background:#dcfce7} .chan.sms{background:#e0e7ff}
.msg-from{font-weight:800;margin:10px 0 6px;color:var(--navy)}
.bubble{background:var(--soft);border-radius:4px 16px 16px 16px;padding:10px 12px;line-height:1.45;font-size:15px;color:var(--navy)}
.phone .btn{margin-top:auto}
</style>
</head>

<script>
/* =====================================================================
   CONFIGURATION — Google Apps Script web-app URL (see README.md)
   ===================================================================== */
const CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbwJ2ar1jaI1aijDkuGHl28Zc-_J7lQLPGZkjvRHI6J0pCRROxcP6j-Nw2H52u0l7tqE/exec",
  STUDY_VERSION: "v4-messages",
  START_BALANCE: 10000,
  ONE_SESSION_PER_DEVICE: true
};

/* =====================================================================
   EXPERIMENTAL DESIGN (unchanged from v2)
   8 scenarios = 2x2x2 crossing of urgency x amount x presentation.
   Each has a GENUINE and a FRAUDULENT version that differ ONLY in the
   sender-identity cue (wallet address, registered name, history).
   Per participant: 4 random fraudulent + 4 genuine, random order.
   Notification condition: every request arrives the same way (in-app
   notification only), so notification is held constant.
   ===================================================================== */
const NOTIFICATION_CONDITION = "In-app notification only";
const SCENARIOS = [
  { id:"S1", label:"Mariam Hassan – Thursday dinner",
    urgency:"No", amountLevel:"Low", presentation:"Personal",
    displayName:"Mariam Hassan", initials:"MH", amount:180,
    note:"Thursday dinner 🍕 your share", expiry:"Expires in 7 days", received:"2 hours ago",
    genuine:{ address:"mariam.hassan@pay", registeredName:"MARIAM HASSAN MAHMOUD ELSAYED", history:"6 previous transactions · last on 12 Oct" },
    fraud:{   address:"mariam.hasan22@pay", registeredName:"MOHAMED ABDELRAHMAN SAEED", history:"No previous transactions" } },
  { id:"S2", label:"Book Corner – delivery fee",
    urgency:"No", amountLevel:"Low", presentation:"Official",

    note:"DELIVERY FEE – ORDER #20417", expiry:"Expires in 7 days", received:"10 minutes ago",
    genuine:{ address:"bookcorner@pay", registeredName:"BOOK CORNER BOOKSTORE", history:"2 previous transactions · last on 26 Oct" },
    fraud:{   address:"bookcorner.delivery@pay", registeredName:"MAHMOUD ADEL RAGAB", history:"No previous transactions" } },
  { id:"S3", label:"Youssef Tarek – money sent by mistake",
    urgency:"No", amountLevel:"High", presentation:"Personal",
    displayName:"Youssef Tarek", initials:"YT", amount:1500,
    note:"sorry, sent you 1,500 by mistake yesterday 🤦‍♂️ can you send it back?", expiry:"Expires in 7 days", received:"1 hour ago",
    genuine:{ address:"youssef.tarek@pay", registeredName:"YOUSSEF TAREK ABDELAZIZ", history:"You received EGP 1,500 from this account yesterday" },
    fraud:{   address:"youssef.tarek.eg@pay", registeredName:"AHMED SAMIR FATHY", history:"No previous transactions" } },
  { id:"S4", label:"Nada Housing – apartment deposit",
    urgency:"No", amountLevel:"High", presentation:"Official",
    displayName:"Nada Housing Services", initials:"NH", amount:2000,

  { id:"S5", label:"Omar Khaled – taxi share",
    urgency:"Yes", amountLevel:"Low", presentation:"Personal",
    displayName:"Omar Khaled", initials:"OK", amount:70,
    note:"taxi share 🚕 please send it NOW, I'm at the cashier and short on balance!!", expiry:"Expires in 10 minutes", received:"Just now",
    genuine:{ address:"omar.khaled@pay", registeredName:"OMAR KHALED MOSTAFA", history:"9 previous transactions · last on 20 Oct" },
    fraud:{   address:"omar.khaled.01@pay", registeredName:"AHMED KAMAL IBRAHIM", history:"No previous transactions" } },
  { id:"S6", label:"City Sports Club – membership",
    urgency:"Yes", amountLevel:"Low", presentation:"Official",
    displayName:"City Sports Club", initials:"CS", amount:150,
    note:"MEMBERSHIP PAYMENT DUE TODAY – ACCESS SUSPENDED AFTER 23:59", expiry:"Expires in 15 minutes", received:"Just now",

    fraud:{   address:"citysports.club@pay", registeredName:"HAZEM MOHAMED ABDO", history:"No previous transactions" } },
  { id:"S7", label:"Laila Adel – pharmacy for mom",
    urgency:"Yes", amountLevel:"High", presentation:"Personal",
    displayName:"Laila Adel", initials:"LA", amount:1200,
    note:"at the hospital with mom 😢 need 1,200 for the pharmacy RIGHT NOW please", expiry:"Expires in 10 minutes", received:"Just now",
    genuine:{ address:"laila.adel@pay", registeredName:"LAILA ADEL MOHAMED", history:"14 previous transactions · last on 24 Oct" },
    fraud:{   address:"laila.adel7@pay", registeredName:"KARIM SAMY HELMY", history:"No previous transactions" } },
  { id:"S8", label:"Sea Breeze Travel Club – Alexandria trip",
    urgency:"Yes", amountLevel:"High", presentation:"Official",
    displayName:"Sea Breeze Travel Club", initials:"SB", amount:2450,
    note:"FINAL NOTICE: ALEXANDRIA TRIP BOOKING CANCELLED UNLESS PAID WITHIN 15 MIN", expiry:"Expires in 15 minutes", received:"Just now",
    genuine:{ address:"seabreeze.travel@pay", registeredName:"SEA BREEZE TRAVEL CLUB", history:"1 previous transaction · last on 27 Oct" },
    fraud:{   address:"seabreeze.bookings@pay", registeredName:"MAHMOUD FAROUK ZAKI", history:"No previous transactions" } }
];
const N_FRAUD = 4;

/* =====================================================================
   PRE-REQUEST MESSAGE (social-engineering variable, added in v4)
   Per participant: 4 of the 8 requests are preceded by a phone message
   (2 genuine + 2 fraudulent, chosen at random), the other 4 arrive with
   no message. For a given scenario the message is IDENTICAL in the
   genuine and fraudulent versions, so the message itself never reveals
   the answer – only its presence/absence is manipulated.
   ===================================================================== */
const N_MSG_PER_TRUTH = 2;
const MESSAGES = {
  S1:{ channel:"WhatsApp", sender:"Mariam Hassan", type:"Bill-split reminder",
       text:"Hey! Sent you the request for Thursday's dinner 🍕 180 each, pay whenever you can" },
  S2:{ channel:"SMS", sender:"BookCorner", type:"Delivery notice",
       text:"Your order #20417 is out for delivery. A EGP 35 delivery fee request has been sent to your payment app." },
  S3:{ channel:"WhatsApp", sender:"+20 112 345 6789", type:"Mistaken transfer (unknown number)",
       text:"Hi, I accidentally transferred money to your account. This is my old number, and I'm your friend Youssef. Could you please send the 1,500 back? I sent you a request." },
  S4:{ channel:"SMS", sender:"NadaHousing", type:"Payment reminder",
       text:"Reminder: your November deposit for Apartment 4B is due. A payment request of EGP 2,000 has been sent to you." },
  S5:{ channel:"WhatsApp", sender:"Omar Khaled", type:"Urgent favour",
       text:"send the taxi money NOW pls 🙏 I'm at the cashier and my balance is short" },
  S6:{ channel:"SMS", sender:"CitySports", type:"Suspension warning",
       text:"Your membership expires TODAY. Pay EGP 150 now to avoid suspension. A payment request has been sent to you." },
  S7:{ channel:"WhatsApp", sender:"Laila (sister)", type:"Family emergency",
       text:"Mom is at the hospital 😢 I need 1,200 for the pharmacy right now. Sent you a request, please hurry" },
  S8:{ channel:"SMS", sender:"SeaBreeze", type:"Cancellation threat",
       text:"FINAL NOTICE: Your Alexandria trip booking will be CANCELLED unless EGP 2,450 is paid within 15 minutes. Request sent." }
};
const MSG_Q = "Did the message you received before this request influence your decision to accept or reject it?";
const MSG_OPTIONS = ["Yes, it made me more likely to accept.","Yes, it made me more likely to reject.",
                     "No, it did not influence my decision.","I am not sure."];

/* =====================================================================
   PART C — per-request follow-up (replaces the old end-of-study Part C)
   Each reason has its own binary column (key) and a factor code used
   for the factor-level Reason_* variables in the Analysis Dataset.
   ===================================================================== */
const ACCEPT_Q = "Why did you accept this request?";
const REJECT_Q = "Why did you reject this request?";
const ACCEPT_REASONS = [
  { key:"acc_recognized_sender",  text:"I recognized the sender.",                          factor:"Sender_Name" },
  { key:"acc_amount_reasonable",  text:"The amount seemed reasonable.",                     factor:"Amount" },
  { key:"acc_notification",       text:"The notification influenced my decision.",          factor:"Notification" },
  { key:"acc_note_legitimate",    text:"The note made the request seem legitimate.",        factor:"Note" },
  { key:"acc_trusted_sender",     text:"I trusted the sender.",                             factor:"Relationship" },
  { key:"acc_seemed_urgent",      text:"The request seemed urgent.",                        factor:"Urgency" },
  { key:"acc_familiar_type",      text:"I was familiar with this type of request.",         factor:"Familiarity" },
  { key:"acc_nothing_suspicious", text:"I did not notice anything suspicious.",             factor:"No_Red_Flags" },
  { key:"acc_presentation",       text:"The way the request was presented looked genuine.", factor:"Presentation" }
];
const REJECT_REASONS = [
  { key:"rej_unrecognized_sender", text:"I did not recognize the sender.",                       factor:"Sender_Name" },
  { key:"rej_amount_suspicious",   text:"The amount seemed suspicious.",                         factor:"Amount" },
  { key:"rej_notification",        text:"The notification made me uncomfortable.",               factor:"Notification" },
  { key:"rej_note_suspicious",     text:"The note seemed suspicious or unclear.",                factor:"Note" },
  { key:"rej_distrust_sender",     text:"I did not trust the sender.",                           factor:"Relationship" },
  { key:"rej_seemed_unusual",      text:"The request seemed unusual.",                           factor:"Unusual" },
  { key:"rej_timing",              text:"The timing made me suspicious.",                        factor:"Timing" },
  { key:"rej_uncomfortable",       text:"I did not feel comfortable approving the request.",     factor:"Discomfort" },
  { key:"rej_urgency",             text:"The urgency of the request made me suspicious.",        factor:"Urgency" },
  { key:"rej_presentation",        text:"The way the request was presented looked suspicious.",  factor:"Presentation" }
];
const FACTORS = ["Notification","Sender_Name","Amount","Note","Relationship","Timing","Urgency","Presentation",
                 "Familiarity","No_Red_Flags","Unusual","Discomfort"];

/* =====================================================================
   QUESTIONNAIRE
   Part D (age) – before the requests.  Parts A & B – after the requests
   (original placement).  No typed answers anywhere.
   ===================================================================== */
const FREQ5 = ["Never","Rarely","Sometimes","Often","Always"];
const PART_D = { tag:"Part D", title:"Before you begin", questions:[
  { key:"age_range", type:"single", text:"What is your age range?",
    options:["Under 18","18–24","25–34","35–44","45–54","55–64","65 or above","Prefer not to say"] }
]};
const POST_SECTIONS = [
  { tag:"Part A", title:"Your use of digital payment apps", questions:[
    { key:"A1_usage_frequency", type:"single", text:"How frequently do you use digital payment applications?",
      options:["Daily","Several times a week","About once a week","A few times a month","Less than once a month"] },
    { key:"A2_usage_duration", type:"single", text:"How long have you been using digital payment applications?",
      options:["Less than 6 months","6–12 months","1–2 years","3–5 years","More than 5 years"] },
    { key:"A3_transaction_confidence", type:"scale", text:"How confident do you feel when making digital payment transactions?",
      anchors:["Not at all confident","Very confident"] },
    { key:"A4_suspicious_requests_seen", type:"single", text:"Have you previously encountered suspicious digital payment requests?",
      options:["Never","Once","A few times","Many times","Not sure"] },
    { key:"A5_scam_experience", type:"single", text:"Have you ever experienced or encountered a digital payment scam?",
      options:["No","Yes – someone tried, but I did not lose money","Yes – I lost money","Prefer not to say"] }
  ]},
  { tag:"Part B", title:"Your usual habits", questions:[
    { key:"B1_verify_sender", type:"single", text:"Do you normally verify the sender's identity before accepting a payment request?", options:FREQ5 },
    { key:"B2_amount_importance", type:"scale", text:"How important is the requested amount when you decide whether to accept a payment request?",
      anchors:["Not at all important","Extremely important"] },
    { key:"B3_urgency_influence", type:"single", text:"How does urgent wording (for example “pay now” or a short deadline) affect your willingness to accept a payment request?",
      options:["Makes me much less willing","Makes me somewhat less willing","No effect","Makes me somewhat more willing","Makes me much more willing"] },
    { key:"B4_inspect_details", type:"single", text:"Do you normally inspect the information in a payment request before making a decision?", options:FREQ5 },
    { key:"B5_detection_confidence", type:"scale", text:"How confident are you in distinguishing genuine payment requests from fraudulent ones?",
      anchors:["Not at all confident","Very confident"] }
  ]}
];
// progress units: Part D (1) + 8 requests + Part A (1) + Part B (1)
const TOTAL_UNITS = 1 + SCENARIOS.length + POST_SECTIONS.length;

/* =====================================================================
   STATE + HELPERS
   ===================================================================== */
const S = { pid:null, start:null, fraudSet:[], msgSet:[], order:[], idx:0, shownAt:0, decidedAt:0, msgShownAt:0, msgViewMs:"",
            pending:null, responses:[], answers:{}, balance:CONFIG.START_BALANCE, section:0, end:null };
function store(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function load(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function makeId(){
  const abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; const arr=new Uint32Array(6);
  try{ crypto.getRandomValues(arr); }catch(e){ for(let i=0;i<6;i++) arr[i]=Math.floor(Math.random()*1e9); }
  for(let i=0;i<6;i++) s+=abc[arr[i]%abc.length]; return "P-"+s;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n){ return n.toLocaleString("en-US"); }
function nowIso(){ return new Date().toISOString(); }
function deviceType(){ const ua=navigator.userAgent||""; return /iPhone|iPad|iPod/i.test(ua)?"iOS":/Android/i.test(ua)?"Android":/Mobi/i.test(ua)?"Other mobile":"Desktop"; }
const $app=document.getElementById("app");
function scrollTop(){ window.scrollTo(0,0); }
function pct(units){ return Math.round(100*units/TOTAL_UNITS); }

/* =====================================================================
   SAVING (queue + retry + on-device backup; each request saved at once)
   ===================================================================== */
async function postOnce(payload){
  const body=JSON.stringify(payload);
  try{
    const r=await fetch(CONFIG.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
    const j=await r.json(); if(j&&j.ok) return "ok"; throw new Error((j&&j.error)||"bad response");
  }catch(e){
    try{ await fetch(CONFIG.SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body}); return "unconfirmed"; }
    catch(e2){ return "fail"; }
  }
}
let flushing=null;
function send(payload){ const q=load("pending")||[]; q.push(payload); store("pending",q); return flush(); }
function flush(){
  if(!CONFIG.SCRIPT_URL) return Promise.resolve("no-url");
  if(flushing) return flushing.then(()=>flush());
  flushing=(async()=>{
    let q=load("pending")||[], last="ok";
    while(q.length){
      let res="fail";
      for(let a=0;a<4&&res==="fail";a++){ if(a) await new Promise(r=>setTimeout(r,1500*a)); res=await postOnce(q[0]); }
      if(res==="fail"){ last="fail"; break; }
      if(res==="unconfirmed") last="unconfirmed";
      q.shift(); store("pending",q);
    }
    return last;
  })();
  const p=flushing; p.finally(()=>{ if(flushing===p) flushing=null; }); return p;
}
window.addEventListener("online",()=>{ flush(); });

function counts(){
  const d=S.responses;
  return {
    requests_completed:d.length,
    accept_count:d.filter(x=>x.decision==="Accept").length,
    reject_count:d.filter(x=>x.decision==="Reject").length,
    n_correct:d.filter(x=>x.correct===1).length,
    accuracy_pct:d.length?Math.round(100*d.filter(x=>x.correct===1).length/d.length):"",
    false_acceptances:d.filter(x=>x.error_type==="False acceptance").length,
    false_rejections:d.filter(x=>x.error_type==="False rejection").length,
    accepts_with_message:d.filter(x=>x.message_shown==="Yes"&&x.decision==="Accept").length,
    accepts_without_message:d.filter(x=>x.message_shown==="No"&&x.decision==="Accept").length,
    false_acceptances_with_message:d.filter(x=>x.message_shown==="Yes"&&x.error_type==="False acceptance").length,
    false_acceptances_without_message:d.filter(x=>x.message_shown==="No"&&x.error_type==="False acceptance").length
  };
}
function participantRow(status){
  const row={ participant_id:S.pid, study_version:CONFIG.STUDY_VERSION, start_time:S.start,
    end_time:S.end||"", duration_sec:S.end?Math.round((new Date(S.end)-new Date(S.start))/1000):"",
    consent:"Yes", completion_status:status, device:deviceType(),
    fraudulent_scenarios:S.fraudSet.join(";"), message_scenarios:S.msgSet.join(";"), presentation_order:S.order.join(";"), ...counts() };
  [PART_D,...POST_SECTIONS].forEach(sec=>sec.questions.forEach(q=>{ const v=S.answers[q.key]; row[q.key]=v===undefined?"":v; }));
  return row;
}

function nextRequest(){

function screenMessage(){

function currentScenario(){
  const sc=SCENARIOS.find(s=>s.id===S.order[S.idx]); const isFraud=S.fraudSet.includes(sc.id);

function screenRequest(){

function decide(decision){
  const rt=Math.round(performance.now()-S.shownAt); S.decidedAt=performance.now();
  const { sc, isFraud, v }=currentScenario();
  const truth=isFraud?"Fraudulent":"Genuine";
  const correct=(truth==="Genuine"&&decision==="Accept")||(truth==="Fraudulent"&&decision==="Reject");
  S.pending={ sc, v, isFraud, truth, decision, correct, rt, decision_time:nowIso(),
    msgShown:S.msgSet.includes(sc.id), msgViewMs:S.msgViewMs,
    error_type: correct?"None":(truth==="Fraudulent"?"False acceptance":"False rejection") };
  if(decision==="Accept") S.balance-=sc.amount;
  screenReason();
}
function screenReason(){
  const P=S.pending, acc=P.decision==="Accept", list=acc?ACCEPT_REASONS:REJECT_REASONS, official=P.sc.presentation==="Official";
  $app.innerHTML=topbar(`Request ${S.idx+1} of ${SCENARIOS.length}`, 1+S.idx+0.5)+`<div class="content lift"><div class="card">
    <div class="mini"><div class="avatar ${official?"official":"personal"}">${esc(P.sc.initials)}</div>
      <div><b>${esc(P.sc.displayName)}</b><div class="small muted">EGP ${fmt(P.sc.amount)}</div></div>
      <span class="badge ${acc?"acc":"rej"}">${acc?"ACCEPTED":"REJECTED"}</span></div>
    <div class="q" data-key="reasons"><div class="q-title">${acc?ACCEPT_Q:REJECT_Q}</div>
      <div class="q-hint">Select all that apply.</div>
      ${list.map(o=>`<label class="opt"><input type="checkbox" value="${o.key}"><span>${esc(o.text)}</span></label>`).join("")}
      <div class="err">Please select at least one reason.</div></div>
    ${P.msgShown?`<div class="q" data-key="msg"><div class="q-title">${esc(MSG_Q)}</div>
      ${MSG_OPTIONS.map(o=>`<label class="opt"><input type="radio" name="msg_influence" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>`:""}
    <button class="btn btn-primary" id="next" disabled>Continue</button>
  </div></div>`;
  const boxes=[...document.querySelectorAll('.q[data-key="reasons"] .opt input')], radios=[...document.querySelectorAll('input[name="msg_influence"]')], next=document.getElementById("next");
  const upd=()=>{
    document.querySelectorAll(".opt").forEach(l=>l.classList.toggle("sel",l.querySelector("input").checked));
    next.disabled=!boxes.some(x=>x.checked) || (P.msgShown && !radios.some(r=>r.checked));
  };
  boxes.concat(radios).forEach(b=>b.onchange=upd);
  next.onclick=()=>{
    const chosen=boxes.filter(b=>b.checked).map(b=>b.value); if(!chosen.length) return;
    const r=radios.find(x=>x.checked); if(P.msgShown && !r) return;
    next.disabled=true; saveResponse(chosen, r?r.value:"");
    S.idx++; if(S.idx<SCENARIOS.length) nextRequest(); else { S.section=0; screenPost(); }
  };

function saveResponse(chosen, msgAnswer){
  const P=S.pending, acc=P.decision==="Accept", list=acc?ACCEPT_REASONS:REJECT_REASONS, other=acc?REJECT_REASONS:ACCEPT_REASONS;
  const row={
    timestamp:nowIso(), participant_id:S.pid, request_id:P.sc.id, response_id:`${S.pid}_${P.sc.id}`, position:S.idx+1,
    scenario_label:P.sc.label, ground_truth:P.truth, decision:P.decision, correct:P.correct?1:0, error_type:P.error_type,
    decision_time:P.decision_time, response_time_ms:P.rt, reason_time_ms:Math.round(performance.now()-S.decidedAt),
    followup_question:acc?ACCEPT_Q:REJECT_Q,
    selected_reasons:list.filter(o=>chosen.includes(o.key)).map(o=>o.text).join(" | "), n_reasons:chosen.length,
    display_name:P.sc.displayName, wallet_address:P.v.address, registered_name:P.v.registeredName,
    history_with_sender:P.v.history, sender_identity_consistent:P.isFraud?"No":"Yes",
    amount_egp:P.sc.amount, amount_level:P.sc.amountLevel, urgency:P.sc.urgency, presentation:P.sc.presentation,
    notification_condition:NOTIFICATION_CONDITION, note:P.sc.note, expiry:P.sc.expiry, age_range:S.answers.age_range||"",
    message_shown:P.msgShown?"Yes":"No",
    message_type:P.msgShown?MESSAGES[P.sc.id].type:"", message_channel:P.msgShown?MESSAGES[P.sc.id].channel:"",
    message_sender:P.msgShown?MESSAGES[P.sc.id].sender:"", message_text:P.msgShown?MESSAGES[P.sc.id].text:"",
    message_view_ms:P.msgShown?P.msgViewMs:"",
    message_influence:P.msgShown?msgAnswer:"Not asked (no message)"
  };
  list.forEach(o=>row[o.key]=chosen.includes(o.key)?1:0);
  other.forEach(o=>row[o.key]="");               // not shown for this decision
  FACTORS.forEach(f=>row["Reason_"+f]=list.some(o=>o.factor===f&&chosen.includes(o.key))?1:0);
  S.responses.push(row);
  send({ participant:participantRow("In progress"), responses:[row] });
}
function renderQuestion(q){
  let h=`<div class="q" data-key="${q.key}"><div class="q-title">${esc(q.text)}</div>`;
  if(q.type==="single") q.options.forEach(o=>{ h+=`<label class="opt"><input type="radio" name="${q.key}" value="${esc(o)}"><span>${esc(o)}</span></label>`; });
  else if(q.type==="scale") h+=`<div class="scale">`+[1,2,3,4,5].map(n=>`<label><input type="radio" name="${q.key}" value="${n}">${n}</label>`).join("")+`</div>
      <div class="anchors"><span>1 = ${esc(q.anchors[0])}</span><span>5 = ${esc(q.anchors[1])}</span></div>`;
  return h+`<div class="err">Please answer this question.</div></div>`;
}
function screenQuestions(sec, units, onDone, btnLabel){

    form.querySelectorAll("label.opt, .scale label").forEach(l=>{ const i=l.querySelector("input"); l.classList.toggle("sel",i.checked); });

  });
  document.getElementById("next").onclick=()=>{

      if(val===""){ qd.classList.add("invalid"); if(!bad) bad=qd; } else S.answers[q.key]=val;
    });
    if(bad){ bad.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    onDone();
  };
  scrollTop();
}
function screenPost(){
  const sec={...POST_SECTIONS[S.section]};

  <div class="card"><h2>What this study was about</h2>
    <p>Some of the requests you saw were <b>fraudulent</b>. The study looks at which cues (sender, amount, urgency, wording, look) lead people to pay fake requests or to refuse real ones.</p>

    <p>You answered <b>${c.n_correct} of ${SCENARIOS.length}</b> correctly.</p>${items}</div>

    <li>Check the registered account name and the exact address, character by character, before paying.</li>
